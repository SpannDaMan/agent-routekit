name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-candidate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate release candidate
        run: python tools/validate_release_candidate.py
      - name: Install the CLI without runtime dependencies
        run: python -m pip install --no-deps .
      - name: Smoke-test installed CLI
        run: >-
          agent-routekit plan
          --registry plugins/agent-routekit/routes.example.json
          --task plugins/agent-routekit/examples/high-risk-task.json
          --format text
