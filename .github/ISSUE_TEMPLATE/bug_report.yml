name: Bug report
description: Report a reproducible routing, validation, or receipt defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove secrets and private task content before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a sanitized task, registry fragment, command, and output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Did the defect affect a high-risk verification decision?
      options:
        - "Yes"
        - "No"
        - "Unknown"
    validations:
      required: true
